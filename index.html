<!DOCTYPE html>
<html>
<head>
<title>Shree Baijinath Secondary School</title>
<style>
body{
    margin:0;
    height:100vh;
    background-image:url("https://media.istockphoto.com/id/1394876713/video/technology-digital-big-data-connection-digital-cyberspace-digital-data-network-and-blockchain.avif?s=640x640&k=20&c=B6YWl2AvuDrnhUtRfeRZuh7v5QlNH3hJAFxV7y6eMv8=");
    background-size:cover;
    background-position:center;
    font-family: Arial;
}


.header{
    display:flex;
    align-items:center;
    padding:15px 40px;
    background:rgba(0,0,0,0.7);
    box-shadow:0 0 10px black;
}

.logo{
    width:60px;
    height:60px;
    border-radius:50%;
    margin-right:15px;
}

.school-name{
    color:#ffe066;
    font-size:28px;
    font-weight:bold;
}

.main{
    height:calc(100vh - 90px);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background: rgba(0,0,0,0.7);
    padding: 50px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 0 20px black;
}

h1{
    color: #ffe066;
    font-size: 40px;
}

p{
    color: #ddd;
    font-size: 18px;
    margin-bottom: 30px;
}

button{
    background: linear-gradient(90deg,#ff9900,#ff5500);
    color: white;
    font-size: 22px;
    font-weight: bold;
    padding: 15px 40px;
    border: none;
    border-radius: 50px;
    cursor:pointer;
    transition: 0.3s;
}

button:hover{
    transform: scale(1.1);
    box-shadow: 0 0 25px orange;
}
h4{
    color: aqua;
    text-align: center;
}
</style>
</head>

<body>
<div class="header">
    <img class="logo" src="https://cdn-icons-png.flaticon.com/512/201/201614.png">
    <div class="school-name">Shree Baijinath Secondary School</div>
    <br>
  
</div>

<div class="main">
    <div class="container">
          <h4>CREATED BY AAYUSH PANT</h4>
        <h1>Welcome 👋</h1>
        <p>This website is specially designed for Class 9 students to learn technical subjects easily.</p>

        <form action="form.html">
            <button type="submit">Get Started 🚀</button>
        </form>
    </div>
</div>

</body>
</html>
